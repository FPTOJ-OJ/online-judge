version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL 8.0 (Cấu hình hiệu năng cao cho Production)
  db:
    image: mysql:8.0
    container_name: fptoj-db-tier3
    restart: always
    command: --innodb-buffer-pool-size=2G --innodb-log-file-size=512M --max-connections=500
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ${DATA_DIR}/mysql:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fptoj-redis-tier3
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  # 3. Web Application (uWSGI - 8 workers cho Tier 3)
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fptoj-web-tier3
    restart: always
    environment:
      - DMOJ_SERVICE_TYPE=web
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DEBUG=${DEBUG}
      - SITE_NAME=${SITE_NAME}
      - SITE_LONG_NAME=${SITE_LONG_NAME}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EVENT_DAEMON_POST=ws://wsevent:15101/
    volumes:
      - ${DATA_DIR}/pdfcache:/data/pdfcache
      - ${DATA_DIR}/datacache:/data/datacache
      - ./nginx.conf:/app/nginx.conf:ro
    depends_on:
      - db
      - redis

  # 4. Celery Worker (Concurrency = 4 cho Tier 3)
  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fptoj-celery-tier3
    restart: always
    environment:
      - DMOJ_SERVICE_TYPE=celery
      - CELERY_CONCURRENCY=4
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # 5. Websocket Event Server
  wsevent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fptoj-wsevent-tier3
    restart: always
    environment:
      - DMOJ_SERVICE_TYPE=wsevent
    depends_on:
      - web

  # 6. Bridged Connection Server (Phân phối cho máy chấm)
  bridged:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fptoj-bridged-tier3
    restart: always
    environment:
      - DMOJ_SERVICE_TYPE=bridged
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "127.0.0.1:10000:10000"
    depends_on:
      - web

  # 7. Nginx Web Server (Cổng 80)
  nginx:
    image: nginx:alpine
    container_name: fptoj-nginx-tier3
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_DIR}/pdfcache:/data/pdfcache
    depends_on:
      - web
      - wsevent

  # 8. Máy chấm (Judge Server) (Tier 3 - 4 máy chấm chạy song song)
  judge-1:
    image: dmoj/judge-tier3:latest
    container_name: fptoj-judge-tier3-1
    restart: always
    environment:
      - DMOJ_HOST=bridged
      - DMOJ_PORT=10000
      - DMOJ_KEY=${JUDGE_KEY}
      - DMOJ_NAME=${JUDGE_ID}-1
    volumes:
      - ${DATA_DIR}/problems:/problems
    command: ${JUDGE_ID}-1 ${JUDGE_KEY} bridged -p 10000
    depends_on:
      - bridged

  judge-2:
    image: dmoj/judge-tier3:latest
    container_name: fptoj-judge-tier3-2
    restart: always
    environment:
      - DMOJ_HOST=bridged
      - DMOJ_PORT=10000
      - DMOJ_KEY=${JUDGE_KEY}
      - DMOJ_NAME=${JUDGE_ID}-2
    volumes:
      - ${DATA_DIR}/problems:/problems
    command: ${JUDGE_ID}-2 ${JUDGE_KEY} bridged -p 10000
    depends_on:
      - bridged

  judge-3:
    image: dmoj/judge-tier3:latest
    container_name: fptoj-judge-tier3-3
    restart: always
    environment:
      - DMOJ_HOST=bridged
      - DMOJ_PORT=10000
      - DMOJ_KEY=${JUDGE_KEY}
      - DMOJ_NAME=${JUDGE_ID}-3
    volumes:
      - ${DATA_DIR}/problems:/problems
    command: ${JUDGE_ID}-3 ${JUDGE_KEY} bridged -p 10000
    depends_on:
      - bridged

  judge-4:
    image: dmoj/judge-tier3:latest
    container_name: fptoj-judge-tier3-4
    restart: always
    environment:
      - DMOJ_HOST=bridged
      - DMOJ_PORT=10000
      - DMOJ_KEY=${JUDGE_KEY}
      - DMOJ_NAME=${JUDGE_ID}-4
    volumes:
      - ${DATA_DIR}/problems:/problems
    command: ${JUDGE_ID}-4 ${JUDGE_KEY} bridged -p 10000
    depends_on:
      - bridged
