upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    # Cấu hình nén gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Logs
    access_log /var/log/nginx/fptoj_access.log;
    error_log /var/log/nginx/fptoj_error.log;

    # Static assets
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media assets
    location /media/ {
        alias /app/media/;
        expires 30d;
    }

    # Trang web chính qua uWSGI
    location / {
        uwsgi_pass django;
        include uwsgi_params;
        uwsgi_read_timeout 600;
        uwsgi_send_timeout 600;
    }

    # Event Server Websocket (GET)
    location /event/ {
        proxy_pass http://wsevent:15100/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Event Server Poll channels
    location /channels/ {
        proxy_pass http://wsevent:15102;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
