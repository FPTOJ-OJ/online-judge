name: Test Setup Script

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test-setup:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dmoj
          MYSQL_USER: dmoj
          MYSQL_PASSWORD: fake_password
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof curl

      - name: Occupy Default Ports to Test Auto-Detection
        run: |
          # Giả lập chiếm các cổng dịch vụ phụ để kiểm tra chuyển cổng tự động
          # (không chiếm 3306/6379 vì MySQL/Redis đã chạy sẵn trên CI)
          sudo nc -l -p 9999  -k > /dev/null 2>&1 &
          sudo nc -l -p 8888  -k > /dev/null 2>&1 &
          sudo nc -l -p 15100 -k > /dev/null 2>&1 &
          sleep 1
          echo "[i] Đã chiếm cổng 9999, 8888, 15100 để test auto-detection"

      - name: Create Required Directories
        run: mkdir -p logs

      - name: Run Setup Script via stdin pipe
        run: |
          # Chuẩn bị file câu trả lời để pipe vào stdin của script (chạy với tham số -y để tự động đồng ý cấu hình đề xuất).
          # Thứ tự đúng với luồng câu hỏi khi MySQL & Redis đã chạy trên host CI:
          #   1. Tên trang web         → enter (dùng default FPTOJ)
          #   2. Địa chỉ DB host       → enter (127.0.0.1)
          #   3. Cổng DB               → enter (3306)
          #   4. Tên DB                → enter (dmoj)
          #   5. User DB               → enter (dmoj)
          #   6. Mật khẩu DB           → fake_password
          #   7-11. SMTP (host/port/user/pass/from) → 5 lần enter
          #   12. Tên Admin            → enter (để trống = bỏ qua)
          #   13. Thư mục dữ liệu      → /data
          #   14. Domain               → fake.domain.com
          #   15-20. OAuth (6 keys)    → 6 lần enter
          #   21. Tạo tài khoản admin? → n
          #   22. Tên Judge            → test-judge-1
          #   23. Cài Judge?           → n
          #   + 50 dòng trắng padding (đề phòng prompt phụ, tránh set -e EOF crash)
          {
            echo ""
            echo ""
            echo ""
            echo ""
            echo ""
            echo "fake_password"
            echo ""; echo ""; echo ""; echo ""; echo ""
            echo ""
            echo "/data"
            echo "fake.domain.com"
            echo ""; echo ""; echo ""; echo ""; echo ""; echo ""
            echo "n"
            echo "test-judge-1"
            echo "n"
            python3 -c "print('\n' * 50)"
          } | sudo bash ./setup_fptoj.sh -y

      - name: Verify Setup Results
        run: |
          echo "=== Checking local_settings.py ==="
          cat dmoj/local_settings.py | grep "fake.domain.com"
          echo "=== Checking info file ==="
          sudo cat /root/fptoj_setup_info.txt || true

      - name: Prepare Debug Files
        if: always()
        run: |
          mkdir -p debug_files
          cp dmoj/local_settings.py debug_files/ || true
          cp uwsgi.ini debug_files/ || true
          sudo cp /etc/nginx/sites-available/fptoj debug_files/ || true
          sudo cp /root/fptoj_setup_info.txt debug_files/ || true
          sudo cp -r logs debug_files/ || true

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-debug-logs
          path: debug_files
